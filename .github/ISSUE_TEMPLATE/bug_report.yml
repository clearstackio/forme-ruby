name: Bug report
description: Report a reproducible rendering or installation problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use synthetic HTML only. Report security vulnerabilities privately as described in SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Gem version, Ruby version, OS/version, architecture and installation method.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Commands or a small Ruby example with synthetic HTML, CSS and redistributable assets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual results
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Sanitized error and render warnings; do not upload private documents.
