# Publishes to rubygems.org with trusted publishing (OIDC, no API key) and
# Sigstore attestations when a `v*` tag matching version.rb is pushed. It
# promotes the three packages built and qualified by the successful master-branch
# CI run for the tagged commit; it never rebuilds them. The rubygems.org trusted
# publisher names this workflow and the `rubygems` environment.
name: Release
on:
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: rubygems-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: rubygems
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: '3.3'
          rubygems: '4.0.24'
      - name: Check the tag matches the version
        run: |
          version="$(ruby -Ilib -e 'require "forme_pdf/version"; print FormePDF::VERSION')"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Find the qualified CI run for the tagged commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=master&status=success&per_page=1" \
            --jq '.workflow_runs[0]' > /tmp/forme-ci-run.json
          ruby script/ci/verify-run.rb /tmp/forme-ci-run.json
          echo "run_id=$(ruby -rjson -e 'print JSON.parse(File.read(ARGV[0])).fetch("id")' /tmp/forme-ci-run.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run_id }}
          pattern: gems-*
          path: pkg
          merge-multiple: true
      - run: ruby script/ci/verify-release.rb
      - name: Attest tested packages
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: pkg/*.gem
      - name: Publish the GitHub release, or match an existing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release download "$GITHUB_REF_NAME" --pattern '*.gem' --dir /tmp/github-release
            for gem_file in pkg/*.gem; do cmp "$gem_file" "/tmp/github-release/$(basename "$gem_file")"; done
          else
            (cd pkg && sha256sum -- *.gem > SHA256SUMS)
            gh release create "$GITHUB_REF_NAME" pkg/*.gem pkg/SHA256SUMS --verify-tag \
              --title "$GITHUB_REF_NAME" --notes "See the [changelog](https://github.com/$GITHUB_REPOSITORY/blob/master/CHANGELOG.md)."
          fi
      # sigstore-cli and rubygems-await come from gemfiles/release.gemfile.lock
      # (exact versions and checksums), installed before any credential is set.
      - name: Install the locked release tools
        env:
          BUNDLE_GEMFILE: gemfiles/release.gemfile
          BUNDLE_FROZEN: 'true'
        run: bundle install
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Sign and publish the tested packages
        env:
          BUNDLE_GEMFILE: gemfiles/release.gemfile
        run: |
          for gem_file in pkg/*.gem; do
            bundle exec sigstore-cli sign "$gem_file" --bundle "$gem_file.sigstore.json"
            gem push "$gem_file" --attestation "$gem_file.sigstore.json"
          done
      - name: Wait for the release to propagate
        env:
          BUNDLE_GEMFILE: gemfiles/release.gemfile
        run: bundle exec rubygems-await pkg/*.gem
