[package]
name = "forme-pdf-native"
version = "0.2.0"
edition = "2021"
license = "MIT"
[lib]
name = "forme_pdf_native"
crate-type = ["cdylib", "rlib"]
[dependencies]
forme-pdf-html = { git = "https://github.com/danmolitor/forme", rev = "b97dc101b705ea5d7fea6fb1b20fabfb5bd2d63d" }
forme-pdf = { git = "https://github.com/danmolitor/forme", rev = "b97dc101b705ea5d7fea6fb1b20fabfb5bd2d63d" }
html5ever = "0.40.1"
markup5ever_rcdom = "0.39.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ttf-parser = "0.25"
[profile.release]
panic = "unwind"
